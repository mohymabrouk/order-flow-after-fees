[project]
name = "order-flow-profit"
version = "0.1.0"
description = "What is the cheapest order-flow model whose short-horizon forecasts still pay the spread and fees on a Binance USDT-M perpetual?"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars>=1.10",
    "pyarrow>=15",
    "numpy>=2.0",
    "pandas>=2.2",
    "lightgbm>=4.3",
    "torch>=2.5",
    "matplotlib>=3.8",
    "requests>=2.31",
    "pytest>=8.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ofp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
